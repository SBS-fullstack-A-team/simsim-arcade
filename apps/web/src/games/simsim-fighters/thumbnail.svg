<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070312"/>
      <stop offset=".6" stop-color="#2a0e3e"/>
      <stop offset="1" stop-color="#6a1a3a"/>
    </linearGradient>
    <radialGradient id="moon" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 46) scale(70)">
      <stop offset="0" stop-color="#ffd0dc" stop-opacity=".9"/>
      <stop offset=".35" stop-color="#ff5a8a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff2a5a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="clash" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(160 92) scale(70)">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#ffe07a"/>
      <stop offset=".6" stop-color="#ff5a1f" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff2a5a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffe07a"/>
      <stop offset="1" stop-color="#ff3a1a"/>
    </linearGradient>
    <linearGradient id="venom" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff9af6"/>
      <stop offset="1" stop-color="#7a2ad8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffb81a"/>
    </linearGradient>
  </defs>

  <rect width="320" height="180" fill="url(#sky)"/>
  <circle cx="250" cy="46" r="70" fill="url(#moon)"/>
  <circle cx="250" cy="46" r="20" fill="#ffd8e2"/>
  <!-- 성당 실루엣 -->
  <g fill="#12081e">
    <rect x="8" y="64" width="18" height="96"/><path d="M5 64 17 30 29 64z"/>
    <rect x="48" y="84" width="16" height="76"/><path d="M45 84 56 56 67 84z"/>
    <rect x="270" y="80" width="18" height="80"/><path d="M267 80 279 50 291 80z"/>
    <rect x="300" y="96" width="14" height="64"/><path d="M297 96 307 70 317 96z"/>
  </g>
  <rect y="150" width="320" height="30" fill="#1a1020"/>
  <rect y="150" width="320" height="1.5" fill="#ff5a8a" opacity=".6"/>

  <!-- 집중선 -->
  <g stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5">
    <path d="M160 92 0 20M160 92 0 70M160 92 20 180M160 92 320 30M160 92 320 120M160 92 300 180M160 92 110 0M160 92 220 0"/>
  </g>

  <!-- 왼쪽: 불꽃 대검 전사 -->
  <g stroke="#0e0812" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 150 82 122 96 150" fill="none" stroke-width="9"/>
    <path d="M70 150 82 122 96 150" fill="none" stroke="#2a2230" stroke-width="5.5"/>
    <path d="M74 124 80 92 98 90 98 124z" fill="#b8261a"/>
    <rect x="74" y="118" width="25" height="5" fill="#ffb02e"/>
    <circle cx="92" cy="80" r="11" fill="#e8b48a"/>
    <path d="M80 80 74 70 84 72 80 62 92 68 96 58 100 70 106 66 102 78 88 76z" fill="#a8a8b8"/>
    <rect x="96" y="77" width="4" height="3" fill="#ff3a1a" stroke="none"/>
    <path d="M96 94 112 98 124 92" fill="none" stroke-width="8"/>
    <path d="M96 94 112 98 124 92" fill="none" stroke="#e8b48a" stroke-width="5"/>
    <path d="M124 92 150 78 156 82 128 98z" fill="#c8ccd8"/>
    <path d="M128 86 152 74 158 72 150 82z" fill="url(#fire)" stroke="none" opacity=".9"/>
  </g>

  <!-- 오른쪽: 맹독 고양이 수인 -->
  <g stroke="#0e0812" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 150 238 124 224 150" fill="none" stroke-width="8"/>
    <path d="M250 150 238 124 224 150" fill="none" stroke="#4a1a6a" stroke-width="5"/>
    <path d="M248 124 242 94 226 92 228 124z" fill="#2a1438"/>
    <path d="M249 124 254 134 222 134 227 124z" fill="#4a1a6a"/>
    <circle cx="230" cy="82" r="10.5" fill="#f0c8b0"/>
    <path d="M241 84 242 72 232 68 222 72 219 82 226 76z" fill="#6a2aa8"/>
    <path d="M238 70 242 58 234 66z" fill="#6a2aa8"/>
    <path d="M226 68 222 56 220 70z" fill="#6a2aa8"/>
    <rect x="221" y="80" width="3.5" height="3" fill="#ffe02a" stroke="none"/>
    <path d="M226 96 208 100 196 94" fill="none" stroke-width="7"/>
    <path d="M226 96 208 100 196 94" fill="none" stroke="#f0c8b0" stroke-width="4.5"/>
    <path d="M196 94 182 88M196 96 180 96M196 98 182 104" fill="none" stroke="url(#venom)" stroke-width="3"/>
    <path d="M250 116 C272 120 276 92 266 80" fill="none" stroke-width="7"/>
    <path d="M250 116 C272 120 276 92 266 80" fill="none" stroke="#6a2aa8" stroke-width="4"/>
  </g>

  <!-- 충돌 섬광 -->
  <circle cx="160" cy="92" r="70" fill="url(#clash)"/>
  <path d="M160 62 166 84 190 78 170 92 190 106 166 100 160 122 154 100 130 106 150 92 130 78 154 84z" fill="#ffffff"/>
  <g stroke="#ffe07a" stroke-width="2" stroke-linecap="round">
    <path d="M160 92 196 64M160 92 128 62M160 92 200 118M160 92 122 122"/>
  </g>

  <!-- 타이틀 -->
  <g font-family="Arial Black, Impact, sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <text x="160" y="40" font-size="30" fill="#5a0a2a" transform="translate(2 2)">SIMSIM</text>
    <text x="160" y="40" font-size="30" fill="url(#title)" stroke="#0e0812" stroke-width="1.5">SIMSIM</text>
    <text x="160" y="172" font-size="22" fill="#ff5a8a" stroke="#0e0812" stroke-width="1.2" letter-spacing="2">FIGHTERS</text>
  </g>
  <!-- 텐션 게이지 -->
  <g>
    <rect x="12" y="160" width="60" height="7" fill="#0e0812" stroke="#f2e6ff" stroke-width="1"/>
    <rect x="13" y="161" width="19" height="5" fill="#ff5a1f"/>
    <rect x="33" y="161" width="19" height="5" fill="#ff5a1f"/>
    <rect x="53" y="161" width="10" height="5" fill="#2a8aff"/>
    <rect x="248" y="160" width="60" height="7" fill="#0e0812" stroke="#f2e6ff" stroke-width="1"/>
    <rect x="288" y="161" width="19" height="5" fill="#b04aff"/>
    <rect x="276" y="161" width="11" height="5" fill="#2a8aff"/>
  </g>
</svg>
